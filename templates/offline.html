<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#24408e">
<title>You're offline · {{ platform_name }}</title>
<style>
  :root { --bg: #f6f7f9; --surface: #fff; --ink: #1d2433; --muted: #5b6475; --rule: #dfe3ea; --accent: #24408e; --accent-ink: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #12151c; --surface: #1a1e27; --ink: #e7eaf0; --muted: #9aa3b5; --rule: #2c3240; --accent: #8fa8f0; --accent-ink: #10131a; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 28px 24px; max-width: 420px; width: 100%; text-align: center; }
  .icon { width: 56px; height: 56px; border-radius: 14px; background: #24408e; display: grid; place-items: center; margin: 0 auto 14px; }
  h1 { font-size: 1.35rem; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 18px; }
  button { font-family: inherit; font-weight: 600; font-size: 1rem; padding: 11px 20px; border-radius: 6px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; min-height: 44px; }
  small { display: block; margin-top: 14px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.5a15 15 0 0 1 20 0"/><path d="M5 12a10 10 0 0 1 14 0"/><path d="M8.5 15.5a5 5 0 0 1 7 0"/><path d="M12 19h.01"/><path d="M3 3l18 18"/></svg></div>
  <h1>You're offline</h1>
  <p>{{ platform_name }} needs an internet connection to show your packets and forms. Check your Wi-Fi or mobile data, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
  <small>Nothing you already saved is lost.</small>
</main>
<script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
