<!doctype html>
<html lang="en">
<head>{% include "_head.html" %}<title>Create your company account · {{ platform_name }}</title></head>
<body>
<main class="login-box" style="max-width:440px">
  <form class="panel" method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <span class="brand">{% include "_mark.html" %}{{ platform_name }}</span>
    <div class="stack" style="gap:4px"><h1 style="font-size:1.5rem">Create your company account</h1>
      <p class="muted small">You'll be the first manager. After this you can add your forms and invite your team.</p></div>
    {% include "_flash.html" %}
    <label for="company">Company name <span class="hint">Your clients see this on every packet</span><input id="company" type="text" name="company" value="{{ form.get('company','') }}" required autofocus maxlength="100"></label>
    <label for="name">Your name<input id="name" type="text" name="name" value="{{ form.get('name','') }}" required maxlength="80" autocomplete="name"></label>
    <label for="email">Work email <span class="hint">You'll sign in with this</span><input id="email" type="email" name="email" value="{{ form.get('email','') }}" required autocomplete="email"></label>
    <label for="password">Password <span class="hint">At least 8 characters</span><input id="password" type="password" name="password" minlength="8" required autocomplete="new-password"></label>
    <label for="confirm">Repeat password<input id="confirm" type="password" name="confirm" minlength="8" required autocomplete="new-password"></label>
    <button class="btn btn-primary btn-lg">Create account</button>
    <p class="small" style="margin:0">Already have a login? <a href="{{ url_for('login') }}">Sign in</a></p>
  </form>
</main>
</body>
</html>
