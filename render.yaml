# One-click deploy on Render (render.com): New > Blueprint > point at this repo.
services:
  - type: web
    name: formsign
    runtime: docker          # Docker includes LibreOffice so Word/Excel files show on the signing page
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    plan: starter            # a persistent disk needs a paid plan (about US$7/month)
    disk:
      name: formsign-data
      mountPath: /var/data
      sizeGB: 25             # grow this as companies are added
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: PLATFORM_NAME
        value: FormSign
      - key: ALLOW_SIGNUP
        value: "1"
      - key: BASE_URL
        sync: false
      - key: SUPPORT_EMAIL         # who companies contact (Help page, sign-in page, demo ending)
        value: liz@helmmsp.ca
      - key: TRIAL_DAYS
        value: "14"
      - key: DEMO_GRACE_DAYS
        value: "3"
      - key: SUPPORT_NAME
        sync: false
      - key: SUPPORT_PHONE
        sync: false
      - key: HELP_VIDEO_URL
        sync: false
      - key: BACKUP_S3_ENDPOINT      # optional off-site backups (Backblaze B2 or Amazon S3)
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_S3_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET
        sync: false
      - key: NTFY_TOPIC             # support chat alerts to your phone (ntfy app); use a long random name
        sync: false
      - key: CONSOLE_URL            # your Admin Console address, e.g. https://formsign-admin.onrender.com
        sync: false
