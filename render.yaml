# One-click deploy on Render (render.com): New > Blueprint > point at this repo.
services:
  - type: web
    name: formsign
    runtime: docker          # Docker includes LibreOffice so Word/Excel files show on the signing page
    dockerfilePath: ./Dockerfile
    plan: starter            # a persistent disk needs a paid plan (about US$7/month)
    disk:
      name: formsign-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: BUSINESS_NAME
        sync: false
      - key: BASE_URL
        sync: false
